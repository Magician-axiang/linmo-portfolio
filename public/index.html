<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" id="metaDesc" content="Magician-阿祥 — 视频剪辑师 / 新媒体创作者个人作品集" />
  <title id="pageTitle">Magician-阿祥 · 视频剪辑与新媒体创作</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: { 950:'#08080b',900:'#0d0d12',800:'#14141b',700:'#1c1c26',600:'#262633' },
            gold: { 300:'#fcd34d',400:'#fbbf24',500:'#f59e0b' }
          },
          fontFamily: {
            sans: ['Inter','system-ui','sans-serif'],
            display: ['"Space Grotesk"','Inter','sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="bg-ink-950 text-zinc-200 font-sans antialiased selection:bg-gold-400/30 selection:text-white">

  <!-- 背景装饰 -->
  <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="grain"></div>
  </div>

  <!-- 导航 -->
  <header id="navbar" class="fixed top-0 inset-x-0 z-50 transition-all duration-300">
    <nav class="mx-auto max-w-7xl px-5 sm:px-8">
      <div class="mt-4 flex items-center justify-between rounded-2xl border border-white/5 bg-ink-900/60 px-5 py-3 backdrop-blur-xl">
        <a href="#hero" class="flex items-center gap-2.5 group">
          <span id="navLogo" class="grid h-9 w-9 place-items-center rounded-lg bg-gradient-to-br from-gold-300 to-gold-500 text-ink-950 font-display font-bold text-lg">M</span>
          <span id="navName" class="font-display text-lg font-semibold tracking-wide text-white">Magician-阿祥<span class="text-gold-400">.</span></span>
        </a>
        <ul class="hidden md:flex items-center gap-8 text-sm text-zinc-400">
          <li><a href="#works" class="nav-link">作品案例</a></li>
          <li><a href="#skills" class="nav-link">技能</a></li>
          <li><a href="#about" class="nav-link">关于</a></li>
          <li><a href="#contact" class="nav-link">联系</a></li>
        </ul>
        <div class="flex items-center gap-3">
          <a href="#contact" class="hidden sm:inline-flex items-center gap-2 rounded-full bg-white px-4 py-2 text-sm font-medium text-ink-950 transition hover:bg-gold-300">合作邀约</a>
          <button id="menuBtn" class="md:hidden grid h-10 w-10 place-items-center rounded-lg border border-white/10 text-white" aria-label="打开菜单">
            <svg id="menuIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
        </div>
      </div>
      <div id="mobileMenu" class="md:hidden hidden mt-2 rounded-2xl border border-white/5 bg-ink-900/95 p-4 backdrop-blur-xl">
        <ul class="flex flex-col gap-1 text-zinc-300">
          <li><a href="#works" class="mobile-link block rounded-lg px-4 py-3 hover:bg-white/5">作品案例</a></li>
          <li><a href="#skills" class="mobile-link block rounded-lg px-4 py-3 hover:bg-white/5">技能</a></li>
          <li><a href="#about" class="mobile-link block rounded-lg px-4 py-3 hover:bg-white/5">关于</a></li>
          <li><a href="#contact" class="mobile-link block rounded-lg px-4 py-3 hover:bg-white/5">联系</a></li>
          <li class="pt-2"><a href="#contact" class="mobile-link block rounded-lg bg-gold-400 px-4 py-3 text-center font-medium text-ink-950">合作邀约</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <main>
    <!-- Hero（由 app.js 渲染） -->
    <section id="hero" class="relative min-h-screen flex items-center pt-28 pb-16">
      <div id="heroContainer" class="mx-auto max-w-7xl w-full px-5 sm:px-8">
        <div class="grid lg:grid-cols-12 gap-10 items-center"></div>
      </div>
      <a href="#works" class="hidden sm:flex absolute bottom-8 left-1/2 -translate-x-1/2 flex-col items-center gap-2 text-xs text-zinc-500 hover:text-zinc-300 transition">
        向下滚动
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 animate-bounce" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 14l-7 7-7-7M19 7l-7 7-7-7"/></svg>
      </a>
    </section>

    <!-- 作品 -->
    <section id="works" class="relative py-24 sm:py-32">
      <div class="mx-auto max-w-7xl px-5 sm:px-8">
        <div class="reveal flex flex-col sm:flex-row sm:items-end sm:justify-between gap-6 mb-12">
          <div>
            <span class="section-eyebrow">01 — 作品案例</span>
            <h2 class="section-title mt-3">精选项目</h2>
            <p class="mt-3 max-w-xl text-zinc-400">从品牌广告到社媒短视频，以下是我近年最具代表性的创作。点击卡片观看完整作品。</p>
          </div>
        </div>
        <div id="worksGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        <div class="reveal mt-12 text-center">
          <a href="#contact" class="inline-flex items-center gap-2 text-sm text-zinc-400 hover:text-gold-300 transition">
            查看完整作品集 / 合作获取密码
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7-7 7M5 12h16"/></svg>
          </a>
        </div>
      </div>
    </section>

    <!-- 技能 -->
    <section id="skills" class="relative py-24 sm:py-32 border-t border-white/5">
      <div class="mx-auto max-w-7xl px-5 sm:px-8">
        <div class="reveal mb-14 max-w-2xl">
          <span class="section-eyebrow">02 — 技能</span>
          <h2 class="section-title mt-3">从素材到成品的全链路能力</h2>
          <p class="mt-3 text-zinc-400">涵盖剪辑、后期与海外营销三大方向，能独立打通从创意到上线的完整流程。</p>
        </div>
        <div id="skillsGrid" class="grid lg:grid-cols-3 gap-6"></div>
        <div class="reveal mt-16">
          <div class="rounded-3xl border border-white/5 bg-ink-900/50 p-6 sm:p-10">
            <div id="flowGrid" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 关于 -->
    <section id="about" class="relative py-24 sm:py-32 border-t border-white/5">
      <div class="mx-auto max-w-7xl px-5 sm:px-8">
        <div id="aboutContainer" class="grid lg:grid-cols-12 gap-12 items-center"></div>
      </div>
    </section>

    <!-- 联系 -->
    <section id="contact" class="relative py-24 sm:py-32 border-t border-white/5">
      <div class="mx-auto max-w-7xl px-5 sm:px-8">
        <div id="contactContainer" class="grid lg:grid-cols-12 gap-12"></div>
      </div>
    </section>
  </main>

  <!-- 页脚 -->
  <footer class="border-t border-white/5 py-10">
    <div class="mx-auto max-w-7xl px-5 sm:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-sm text-zinc-500">
      <div class="flex items-center gap-2.5">
        <span id="footerLogo" class="grid h-7 w-7 place-items-center rounded-md bg-gradient-to-br from-gold-300 to-gold-500 text-ink-950 font-display font-bold text-sm">M</span>
        <span id="footerText">© 2026 Magician-阿祥 · 个人作品集</span>
      </div>
      <div class="flex items-center gap-6">
        <a href="#works" class="hover:text-zinc-300 transition">作品</a>
        <a href="#about" class="hover:text-zinc-300 transition">关于</a>
        <a href="#contact" class="hover:text-zinc-300 transition">联系</a>
        <a href="/admin" class="hover:text-zinc-300 transition" title="管理后台">管理</a>
      </div>
    </div>
  </footer>

  <!-- 回到顶部 -->
  <button id="toTop" class="fixed bottom-6 right-6 z-40 grid h-11 w-11 place-items-center rounded-full border border-white/10 bg-ink-800/80 text-white opacity-0 translate-y-4 pointer-events-none backdrop-blur transition-all hover:bg-gold-400 hover:text-ink-950" aria-label="回到顶部">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7 7 7M12 3v18"/></svg>
  </button>

  <!-- 视频弹窗 -->
  <div id="videoModal" class="fixed inset-0 z-[60] hidden items-center justify-center p-4">
    <div class="absolute inset-0 bg-ink-950/80 backdrop-blur-sm" data-close-modal></div>
    <div class="relative w-full max-w-4xl">
      <button class="absolute -top-11 right-0 text-zinc-400 hover:text-white text-sm flex items-center gap-1.5" data-close-modal>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 6l12 12M6 18L18 6"/></svg>
        关闭
      </button>
      <div id="videoFrame" class="aspect-video w-full overflow-hidden rounded-2xl border border-white/10 bg-black"></div>
      <h3 id="videoTitle" class="mt-4 font-display text-xl font-semibold text-white"></h3>
      <p id="videoDesc" class="mt-1 text-sm text-zinc-400"></p>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
