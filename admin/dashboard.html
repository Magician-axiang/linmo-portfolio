<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理后台 · Magician-阿祥</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="dash-body">
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="topbar-left">
      <button id="sidebarToggle" class="icon-btn only-mobile" aria-label="菜单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round"/></svg>
      </button>
      <a href="/admin" class="topbrand">
        <span class="toplogo">M</span>
        <span>Magician-阿祥 <span class="dot">·</span> 管理后台</span>
      </a>
    </div>
    <div class="topbar-right">
      <a href="/" target="_blank" class="toplink">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 5l5 5M19 5v6h-6M11 19l-5-5M5 19v-6h6"/></svg>
        查看站点
      </a>
      <button id="logoutBtn" class="toplink">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 4H5a2 2 0 00-2 2v12a2 2 0 002 2h4M16 17l5-5-5-5M21 12H9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        退出
      </button>
    </div>
  </header>

  <div class="dash-shell">
    <!-- 侧边栏 -->
    <aside id="sidebar" class="sidebar">
      <nav class="sidenav">
        <a class="nav-item active" data-section="overview" href="#overview">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          <span>概览</span>
        </a>
        <a class="nav-item" data-section="hero" href="#hero">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 12l9-9 9 9M5 10v10h14V10" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>首页 Hero</span>
        </a>
        <a class="nav-item" data-section="works" href="#works">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3V9z" fill="currentColor"/></svg>
          <span>作品管理</span>
        </a>
        <a class="nav-item" data-section="skills" href="#skills">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2l3 7h7l-5.5 4 2 7-6.5-4-6.5 4 2-7L2 9h7z" stroke-linejoin="round"/></svg>
          <span>技能</span>
        </a>
        <a class="nav-item" data-section="about" href="#about">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7" stroke-linecap="round"/></svg>
          <span>关于我</span>
        </a>
        <a class="nav-item" data-section="contact" href="#contact">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7l9 6 9-6M4 5h16a1 1 0 011 1v12a1 1 0 01-1 1H4a1 1 0 01-1-1V6a1 1 0 011-1z" stroke-linejoin="round"/></svg>
          <span>联系方式</span>
        </a>
        <a class="nav-item" data-section="meta" href="#meta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1l2-1.5-2-3.5-2.4 1a7 7 0 00-1.7-1L14.5 3h-5l-.3 2.5a7 7 0 00-1.7 1l-2.4-1-2 3.5L3.1 11a7 7 0 000 2l-2 1.5 2 3.5 2.4-1a7 7 0 001.7 1l.3 2.5h5l.3-2.5a7 7 0 001.7-1l2.4 1 2-3.5-2-1.5a7 7 0 00.1-1z" stroke-linejoin="round"/></svg>
          <span>站点设置</span>
        </a>
        <a class="nav-item" data-section="password" href="#password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4" stroke-linecap="round"/></svg>
          <span>修改密码</span>
        </a>
      </nav>
      <div class="sidefoot">
        <span id="adminUser" class="sideuser">admin</span>
        <span class="sidever">v1.0</span>
      </div>
    </aside>
    <div id="sidebarMask" class="side-mask"></div>

    <!-- 主内容 -->
    <main class="content">
      <div id="contentArea" class="content-area"></div>
    </main>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="js/dashboard.js"></script>
</body>
</html>
