# Render 蓝图 — 一键部署 Web 服务 + PostgreSQL
# Render 自动创建 PostgreSQL 并注入 DATABASE_URL，无需手动配置
services:
  - type: web
    name: linmo-portfolio
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # 会话密钥自动生成
      - key: SESSION_SECRET
        generateValue: true
      # 管理员账号
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false # 在 Render 面板填强密码
      # Render 自带 Postgres，无需强制 SSL
      - key: PG_SSL
        value: prefer
      # 上传视频单文件上限（MB）
      - key: MAX_VIDEO_SIZE_MB
        value: "200"

  - type: postgres
    name: linmo-portfolio-db
    plan: free
    # 自动注入 DATABASE_URL 到 web 服务
    databases:
      - name: linmo_portfolio
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: linmo-portfolio-db
          property: connectionString
