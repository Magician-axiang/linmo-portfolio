# Render 蓝图 — 只部署 Web 服务
# PostgreSQL 需单独创建（Render Postgres 或 Neon），然后填 DATABASE_URL
services:
  - type: web
    name: linmo-portfolio
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # 会话密钥自动生成
      - key: SESSION_SECRET
        generateValue: true
      # 管理员账号
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false # 在 Render 面板填强密码
      # 数据库连接串，在 Render 面板填
      - key: DATABASE_URL
        sync: false
      # Render 自带 Postgres 不用强制 SSL；Neon 才需要 require
      - key: PG_SSL
        value: prefer
      # 上传视频单文件上限（MB）
      - key: MAX_VIDEO_SIZE_MB
        value: "200"
      # 触发 redeploy
